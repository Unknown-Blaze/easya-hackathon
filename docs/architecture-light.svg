<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" role="img" aria-labelledby="title desc">
<title id="title">nGoDonate architecture</title>
<desc id="desc">A React 19 and Vite single-page app uses Firebase Authentication and Firestore (users, charity_projects), sends donations through the GemWallet browser extension, and reads recent transactions from a FastAPI service. The FastAPI service in xrpl-js exposes escrow (create, finish, cancel with a Shamir 2-of-3 witness check), NFT mint and transaction routes. GemWallet and FastAPI both talk to the XRP Ledger Testnet over JSON-RPC.</desc>
